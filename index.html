<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071525" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GéoClic" />
  <title>Géopolitique en un Clic</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="brandHome" class="brand-hero" title="Retour aux zones">
    <img src="assets/logo.png" alt="Logo Géopolitique en un Clic" class="app-logo" />
    <div class="brand-copy">
      <h1>Géopolitique en un Clic</h1>
      <p>L'essentiel géopolitique et économique, zone par zone</p>
    </div>
  </header>

  <main>
    <section id="regionPage" class="page">
      <div class="hero">
        <span class="eyebrow">VEILLE MONDIALE</span>
        <h2>Choisissez une zone</h2>
        <p>International ou continent : ouvrez ensuite la veille par jour, semaine ou mois.</p>
      </div>
      <div id="regionGrid" class="region-grid"></div>
    </section>

    <section id="newsPage" class="page" hidden>
      <div class="section-heading">
        <span id="regionIcon" class="region-icon"></span>
        <div>
          <span class="eyebrow">CONDENSÉ</span>
          <h2 id="regionTitle">International</h2>
        </div>
      </div>

      <section class="period-panel">
        <div class="period-tabs" role="tablist" aria-label="Période">
          <button data-period="day" class="period-tab active">Jour</button>
          <button data-period="week" class="period-tab">Semaine</button>
          <button data-period="month" class="period-tab">Mois</button>
        </div>
        <select id="historySelect" aria-label="Choisir une date ou période"></select>
        <p id="coverageText" class="coverage"></p>
      </section>

      <section id="summaryHeader" class="summary-header"></section>
      <section id="newsList" class="news-list"></section>
    </section>
  </main>

  <footer>
    <span class="footer-note">Mise à jour quotidienne • 06h30</span>
    <strong>By W</strong>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
