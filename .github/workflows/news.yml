name: Mettre à jour la veille

on:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/news.yml"
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choisir le mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "backfill=0" >> "$GITHUB_OUTPUT"
          else
            echo "backfill=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Construire la veille
        env:
          BACKFILL_MONTH: ${{ steps.mode.outputs.backfill }}
        run: python scripts/update_news.py
      - name: Enregistrer les nouvelles données
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Géopolitique en un Clic"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "Mise à jour automatique de la veille"
          git push
