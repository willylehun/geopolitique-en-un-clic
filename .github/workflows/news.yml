name: Mettre à jour la veille

on:
  push:
    paths:
      - "scripts/update_news.py"
      - "scripts/manual_backfill.py"
      - ".github/workflows/news.yml"
  schedule:
    # Décalé du début de l’heure : GitHub indique que les cron à forte charge peuvent être retardés/supprimés.
    # Moteur incrémental : un lot différent toutes les 10 minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choisir le mode
        id: mode
        shell: bash
        run: |
          # Veille normale : uniquement la journée civile courante (Europe/Paris).
          # Le moteur incrémental et la rotation des 195 pays restent actifs.
          echo "backfill=0" >> "$GITHUB_OUTPUT"
      - name: Construire la veille
        env:
          BACKFILL_MONTH: ${{ steps.mode.outputs.backfill }}
          FETCH_MULTIPLIER: "8"
          REGION_FETCH_MULTIPLIER: "6"
          COUNTRY_BATCH_SIZE: "40"
          DAY_BATCH_SIZE: "1"
        run: python scripts/update_news.py
      - name: Intégrer le lot manuel vérifié
        run: python scripts/manual_backfill.py
      - name: Enregistrer les nouvelles données
        shell: bash
        run: |
          if git diff --quiet -- data/news.json data/country-coverage.json; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Géopolitique en un Clic"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/country-coverage.json
          git commit -m "Mise à jour automatique de la veille"
          git restore data/monitor-state.json || true
          # Une autre mise à jour (veille électorale, correction manuelle, etc.) peut
          # avoir avancé main pendant la collecte. Rejouer notre commit au-dessus de
          # la branche distante évite le rejet non-fast-forward observé le 24/09.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Conflit réel pendant la synchronisation avec main."
              exit 1
            fi
            echo "main a encore avancé, nouvelle tentative ($attempt/3)…"
            sleep 5
          done
          echo "Impossible de publier après 3 tentatives."
          exit 1

# Déclenchement manuel de la veille du 25/09/2026
