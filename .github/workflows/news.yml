name: Mettre à jour la veille

on:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/news.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choisir le mode
        id: mode
        shell: bash
        run: |
          # Rattrapage exceptionnel de septembre : chaque journée est interrogée séparément.
          # À partir d'octobre, le script repassera automatiquement au seul jour courant.
          MONTH=$(TZ=Europe/Paris date +%m)
          YEAR=$(TZ=Europe/Paris date +%Y)
          if [[ "$YEAR" == "2026" && "$MONTH" == "09" ]]; then
            echo "backfill=1" >> "$GITHUB_OUTPUT"
          else
            echo "backfill=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Construire la veille
        env:
          BACKFILL_MONTH: ${{ steps.mode.outputs.backfill }}
          FETCH_MULTIPLIER: "4"
        run: python scripts/update_news.py
      - name: Enregistrer les nouvelles données
        shell: bash
        run: |
          if git diff --quiet -- data/news.json data/country-coverage.json; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Géopolitique en un Clic"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/country-coverage.json
          git commit -m "Mise à jour automatique de la veille"
          git push
