name: Mettre à jour la veille

on:
  push:
    paths:
      - "scripts/update_news.py"
      - "scripts/manual_backfill.py"
      - "scripts/build_api.py"
      - ".github/workflows/news.yml"
  schedule:
    # GitHub Actions ne garantit pas les cron à haute fréquence : une cadence
    # horaire est plus fiable et évite les suppressions de runs en période chargée.
    # Minute 23 choisie pour éviter les créneaux les plus chargés et réactiver le planning.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choisir le mode
        id: mode
        shell: bash
        run: |
          # Rattrapage limité aux 25 et 26 septembre 2026.
          # Après le 26, retour automatique à la seule journée courante.
          echo "backfill=0" >> "$GITHUB_OUTPUT"
          paris_date="$(TZ=Europe/Paris date +%F)"
          if [ "$paris_date" = "2026-09-26" ]; then
            echo "include_previous_day=1" >> "$GITHUB_OUTPUT"
          else
            echo "include_previous_day=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Construire la veille
        env:
          BACKFILL_MONTH: ${{ steps.mode.outputs.backfill }}
          INCLUDE_PREVIOUS_DAY: ${{ steps.mode.outputs.include_previous_day }}
          FETCH_MULTIPLIER: "8"
          REGION_FETCH_MULTIPLIER: "6"
          COUNTRY_BATCH_SIZE: "10"
          GOOGLE_FALLBACK_BUDGET: "10"
          DAY_BATCH_SIZE: "1"
        run: python scripts/update_news.py
      - name: Intégrer le lot manuel vérifié
        run: python scripts/manual_backfill.py
      - name: Construire l'API
        run: python scripts/build_api.py
      - name: Valider les sorties
        shell: bash
        run: |
          python -m json.tool data/news.json >/dev/null
          python -m json.tool data/country-coverage.json >/dev/null
          python -m json.tool api/news.json >/dev/null
          python -m json.tool api/status.json >/dev/null
          python -m json.tool api/index.json >/dev/null
          python -m json.tool api/latest.json >/dev/null
          python -m py_compile scripts/update_news.py scripts/build_api.py
          node --check app.js
      - name: Enregistrer les nouvelles données
        shell: bash
        run: |
          if git diff --quiet -- data/news.json data/country-coverage.json data/monitor-state.json data/pending-translations.json api/news.json api/status.json api/index.json api/latest.json api/days; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Géopolitique en un Clic"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/country-coverage.json data/monitor-state.json data/pending-translations.json api/news.json api/status.json api/index.json api/latest.json api/days
          git commit -m "Mise à jour automatique de la veille"
          # Une autre mise à jour (veille électorale, correction manuelle, etc.) peut
          # avoir avancé main pendant la collecte. Rejouer notre commit au-dessus de
          # la branche distante évite le rejet non-fast-forward observé le 24/09.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Conflit réel pendant la synchronisation avec main."
              exit 1
            fi
            echo "main a encore avancé, nouvelle tentative ($attempt/3)…"
            sleep 5
          done
          echo "Impossible de publier après 3 tentatives."
          exit 1

# Déclenchement manuel de la veille du 25/09/2026

