name: Vérifier Android TWA

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".well-known/assetlinks.json"
      - ".github/workflows/android-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.6.0"
      - name: Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME introuvable"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager introuvable"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Vérifier Digital Asset Links public
        shell: bash
        run: |
          ASSETLINKS_URL="https://willylehun.github.io/.well-known/assetlinks.json"
          curl --fail --silent --show-error --location "$ASSETLINKS_URL" -o "$RUNNER_TEMP/assetlinks.json"
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "assetlinks.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          package = "com.willylehun.geopolitiqueenunclic"
          fingerprint = "F0:96:FD:D7:F5:BD:59:EF:41:56:A4:9C:20:D0:85:2B:C0:F5:14:5C:EC:7A:FD:AB:35:7A:8B:31:F5:59:10:46"
          ok = any(
              entry.get("target", {}).get("namespace") == "android_app"
              and entry.get("target", {}).get("package_name") == package
              and fingerprint in entry.get("target", {}).get("sha256_cert_fingerprints", [])
              and "delegate_permission/common.handle_all_urls" in entry.get("relation", [])
              for entry in data
          )
          if not ok:
              raise SystemExit("Digital Asset Links invalide ou empreinte absente")
          print("Digital Asset Links OK")
          PY
      - name: Build et lint
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: APK de test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geoclic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
