name: Mise à jour ponctuelle veille présidentielle

on:
  push:
    paths:
      - '.github/workflows/election-patch.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer et valider la mise à jour
        run: python scripts/patch_election_20260924.py
      - name: Publier et nettoyer le correctif ponctuel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_election_20260924.py .github/workflows/election-patch.yml
          git add data/election.json
          git commit -m "Actualiser la veille présidentielle vérifiée du 24 septembre"
          git push
