name: Intégrer la veille présidentielle vérifiée

on:
  push:
    paths:
      - "scripts/patch_election_manual.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer la mise à jour vérifiée
        run: python scripts/patch_election_manual.py
      - name: Valider le JSON
        run: python -m json.tool data/election.json > /dev/null
      - name: Publier les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/election.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajouter Olivier Becht à la veille présidentielle 2027"
          git push
