name: Veille présidentielle 2027

on:
  push:
    paths:
      - "scripts/update_election.py"
      - "scripts/election_background.py"
      - "scripts/test_election_background.py"
      - "data/election-program-reviewed.json"
      - ".github/workflows/election-manual.yml"
  schedule:
    # Plusieurs réveils de secours par heure ; le garde-fou ci-dessous
    # limite les collectes réelles à environ une fois par heure.
    - cron: "12-52/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Vérifier si une collecte présidentielle est nécessaire
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          should_run = True
          state_path = Path("data/election-monitor-state.json")
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
              raw = state.get("last_run_at")
              if raw:
                  last = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - last.astimezone(timezone.utc)).total_seconds()
                  should_run = age >= 50 * 60
                  print(f"Dernière collecte il y a {age/60:.1f} min ; collecte={'oui' if should_run else 'non'}.")
          except Exception as exc:
              print(f"État de cadence illisible ({exc}); collecte autorisée par sécurité.")
              should_run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={1 if should_run else 0}\n")
          PY
      - name: Vérifier la collecte de fond
        if: steps.cadence.outputs.run == '1'
        run: python -m unittest discover -s scripts -p 'test_election_background.py'
      - name: Collecter la veille présidentielle
        if: steps.cadence.outputs.run == '1'
        env:
          ELECTION_BATCH_SIZE: "12"
        run: python scripts/update_election.py
      - name: Valider les sorties
        if: steps.cadence.outputs.run == '1'
        run: |
          python -m json.tool data/election.json >/dev/null
          python -m json.tool data/election-monitor-state.json >/dev/null
          python -m py_compile scripts/update_election.py scripts/election_background.py
      - name: Publier les données vérifiées
        if: steps.cadence.outputs.run == '1'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/election.json data/election-monitor-state.json; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Géopolitique en un Clic"
          git config user.email "actions@users.noreply.github.com"
          git add data/election.json data/election-monitor-state.json
          git commit -m "Mise à jour automatique de la veille présidentielle"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main a avancé ; reconstruction de la veille présidentielle sur le HEAD courant (tentative $attempt)."
            git fetch origin main
            git reset --hard origin/main

            ELECTION_BATCH_SIZE=12 python scripts/update_election.py
            python -m json.tool data/election.json >/dev/null
            python -m json.tool data/election-monitor-state.json >/dev/null
            python -m py_compile scripts/update_election.py scripts/election_background.py

            if git diff --quiet -- data/election.json data/election-monitor-state.json; then
              echo "Aucun changement après resynchronisation."
              exit 0
            fi
            git add data/election.json data/election-monitor-state.json
            git commit -m "Mise à jour automatique de la veille présidentielle"
            sleep 5
          done

          echo "Impossible de publier après 3 reconstructions."
          exit 1
